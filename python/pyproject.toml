[project]
# The distribution is ``d2b-sdk`` — ``d2b`` on PyPI is an unrelated project
# (a BIDS converter). The import package and the console script stay ``d2b``,
# so ``uvx`` needs ``--from``: ``uvx --from d2b-sdk d2b ...``.
name = "d2b-sdk"
dynamic = ["version"]          # single source: d2b/_version.py
description = "D2B Python SDK — Spreadsheets for AI Agents (typed, versioned, governed tables behind an agent-native API)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["d2b", "spreadsheet", "excel", "duckdb", "agents", "mcp", "llm", "etl"]
# No "License :: …" classifier: PEP 639 forbids pairing it with a license
# expression, and PyPI rejects the upload if both are present.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://d2b.dev"
Documentation = "https://docs.d2b.dev"
Repository = "https://github.com/600/d2b-sdk"
Issues = "https://github.com/600/d2b-sdk/issues"

[project.scripts]
d2b = "d2b.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "d2b/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["d2b"]
